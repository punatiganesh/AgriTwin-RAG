<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmer Login | AgriTwin-RAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #081a10;
        --bg-gradient: linear-gradient(
          145deg,
          #06150c 0%,
          #0d2818 45%,
          #133a24 100%
        );
        --card-bg: rgba(14, 34, 23, 0.88);
        --card-border: rgba(52, 211, 153, 0.22);
        --primary-green: #10b981;
        --primary-hover: #059669;
        --emerald-bright: #34d399;
        --text-light: #f8fafc;
        --text-muted: #94a3b8;
        --input-bg: rgba(7, 22, 15, 0.75);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: var(--bg-gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          "Plus Jakarta Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--text-light);
        padding: 24px 16px;
        margin: 0;
        position: relative;
        overflow-x: hidden;
      }

      /* Subtle background glow */
      body::before {
        content: "";
        position: absolute;
        width: 450px;
        height: 450px;
        background: radial-gradient(
          circle,
          rgba(16, 185, 129, 0.12) 0%,
          rgba(0, 0, 0, 0) 70%
        );
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 0;
      }

      .auth-container {
        width: 100%;
        max-width: 430px;
        position: relative;
        z-index: 1;
      }

      .auth-card {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--card-border);
        border-radius: 22px;
        padding: 38px 32px;
        box-shadow:
          0 25px 50px -12px rgba(0, 0, 0, 0.6),
          0 0 35px rgba(16, 185, 129, 0.12);
      }

      .brand-header {
        text-align: center;
        margin-bottom: 26px;
      }

      .brand-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.2) 0%,
          rgba(5, 150, 105, 0.3) 100%
        );
        border: 1px solid rgba(52, 211, 153, 0.35);
        color: var(--emerald-bright);
        font-size: 1.6rem;
        margin-bottom: 12px;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
      }

      .brand-title {
        font-size: 1.65rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.5px;
        margin-bottom: 4px;
      }

      .brand-tagline {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--emerald-bright);
        letter-spacing: 0.4px;
        text-transform: uppercase;
        margin-bottom: 14px;
      }

      .auth-welcome {
        font-size: 1.1rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 2px;
      }

      .auth-subtext {
        font-size: 0.84rem;
        color: var(--text-muted);
      }

      .form-label {
        font-size: 0.84rem;
        font-weight: 600;
        color: #cbd5e1;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .input-wrapper {
        position: relative;
      }

      .input-icon-left {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #64748b;
        font-size: 0.95rem;
        pointer-events: none;
        transition: color 0.2s ease;
      }

      .form-control {
        background: var(--input-bg);
        border: 1px solid rgba(52, 211, 153, 0.22);
        color: #ffffff;
        border-radius: 12px;
        padding: 12px 16px 12px 42px;
        font-size: 0.95rem;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      .form-control::placeholder {
        color: #64748b;
        font-size: 0.9rem;
      }

      .form-control:focus {
        background: rgba(8, 26, 17, 0.95);
        border-color: var(--primary-green);
        color: #ffffff;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        outline: none;
      }

      .form-control:focus + .input-icon-left,
      .input-wrapper:focus-within .input-icon-left {
        color: var(--emerald-bright);
      }

      .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        padding: 6px;
        font-size: 0.95rem;
        border-radius: 6px;
        transition: color 0.2s ease;
      }

      .password-toggle:hover {
        color: var(--emerald-bright);
      }

      .btn-auth {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: #ffffff;
        font-weight: 700;
        border-radius: 12px;
        padding: 13px;
        font-size: 1rem;
        border: none;
        box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
        transition: all 0.2s ease;
        width: 100%;
        letter-spacing: 0.3px;
        margin-top: 8px;
        cursor: pointer;
      }

      .btn-auth:hover:not(:disabled) {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        box-shadow: 0 6px 22px rgba(16, 185, 129, 0.45);
        transform: translateY(-1px);
        color: #ffffff;
      }

      .btn-auth:disabled {
        opacity: 0.75;
        cursor: not-allowed;
      }

      .forgot-link {
        font-size: 0.82rem;
        color: #94a3b8;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .forgot-link:hover {
        color: var(--emerald-bright);
        text-decoration: underline;
      }

      .auth-footer {
        text-align: center;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 0.88rem;
        color: var(--text-muted);
      }

      .auth-link {
        color: var(--emerald-bright);
        text-decoration: none;
        font-weight: 700;
        margin-left: 4px;
        transition: color 0.2s ease;
      }

      .auth-link:hover {
        color: #6ee7b7;
        text-decoration: underline;
      }

      .demo-account-pill {
        margin-top: 16px;
        padding: 10px 14px;
        background: rgba(16, 185, 129, 0.08);
        border: 1px dashed rgba(52, 211, 153, 0.3);
        border-radius: 10px;
        font-size: 0.78rem;
        color: #a7f3d0;
        text-align: center;
      }

      .alert {
        border-radius: 12px;
        font-size: 0.86rem;
        border: none;
      }

      .alert-danger {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
      }

      .alert-success {
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(52, 211, 153, 0.3);
        color: #6ee7b7;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <!-- Brand Header -->
        <div class="brand-header">
          <div class="brand-logo">🌾</div>
          <h1 class="brand-title">AgriTwin-RAG</h1>
          <div class="brand-tagline">AI-Powered Precision Agriculture</div>
          <div class="auth-welcome">Welcome Back</div>
          <p class="auth-subtext">
            Sign in to access your farm intelligence dashboard
          </p>
        </div>

        <!-- Alert Notification -->
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="identifier">
              Email / Mobile Number
            </label>
            <div class="input-wrapper">
              <i class="fas fa-user input-icon-left"></i>
              <input
                type="text"
                class="form-control"
                id="identifier"
                placeholder="Enter mobile or email"
                required
                autocomplete="username"
              />
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label mb-0" for="password"> Password </label>
              <a href="#" class="forgot-link" id="forgotPassLink"
                >Forgot Password?</a
              >
            </div>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon-left"></i>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
                style="padding-right: 42px"
              />
              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="Show or hide password"
              >
                <i class="far fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-auth" id="loginBtn">
            <span id="btnText"
              ><i class="fas fa-sign-in-alt me-2"></i>Sign In</span
            >
            <span id="btnLoading" class="d-none">
              <span
                class="spinner-border spinner-border-sm me-2"
                role="status"
              ></span
              >Signing in...
            </span>
          </button>
        </form>

        <!-- Demo Account Helper -->
        <div class="demo-account-pill">
          <strong>Demo Login:</strong> Mobile: <code>9876543210</code> &bull;
          Password: <code>Demo@1234</code>
        </div>

        <!-- Auth Footer -->
        <div class="auth-footer">
          Don't have an account?
          <a href="register.html" class="auth-link">Create Account</a>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      // 1. Password Toggle
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");
      togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        togglePassword.innerHTML = isPassword
          ? '<i class="far fa-eye-slash"></i>'
          : '<i class="far fa-eye"></i>';
      });

      // 2. Alert Handler
      const alertBox = document.getElementById("alertBox");
      function showAlert(msg, isError = true) {
        alertBox.className = `alert ${isError ? "alert-danger" : "alert-success"} py-2 px-3 mb-3 text-center`;
        alertBox.textContent = msg;
        alertBox.classList.remove("d-none");
      }

      // Check if redirected after registration
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("registered") === "1") {
        showAlert("Account created successfully. Please log in.", false);
      }

      // Forgot Password Handler
      document
        .getElementById("forgotPassLink")
        .addEventListener("click", (e) => {
          e.preventDefault();
          showAlert(
            "Please contact your agricultural extension administrator to reset your password.",
            false,
          );
        });

      // 3. Login Form Submit
      const loginForm = document.getElementById("loginForm");
      const loginBtn = document.getElementById("loginBtn");
      const btnText = document.getElementById("btnText");
      const btnLoading = document.getElementById("btnLoading");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.classList.add("d-none");

        const identifier = document.getElementById("identifier").value.trim();
        const password = passwordInput.value;

        if (!identifier || !password) {
          showAlert("Invalid email/mobile number or password.");
          return;
        }

        // Set Loading State
        loginBtn.disabled = true;
        btnText.classList.add("d-none");
        btnLoading.classList.remove("d-none");

        try {
          const res = await apiFetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identifier, password }),
          });

          const data = await res.json();

          if (res.ok && data.success) {
            showAlert("Authentication successful. Opening dashboard...", false);
            // Invalidate stale local context cache so fresh profile loads
            localStorage.removeItem("agritwin_farm_context");
            setTimeout(() => {
              const nextUrl = urlParams.get("next") || "dashboard.html";
              window.location.href = nextUrl.includes("farm-setup")
                ? "dashboard.html"
                : nextUrl;
            }, 350);
          } else {
            showAlert("Invalid email/mobile number or password.");
          }
        } catch (err) {
          showAlert(
            "Network error connecting to authentication service. Please check your connection.",
          );
        } finally {
          loginBtn.disabled = false;
          btnText.classList.remove("d-none");
          btnLoading.classList.add("d-none");
        }
      });
    </script>
  </body>
</html>
